name: Test harness

# Runs the full harness (scripts/harness.js) in GitHub's cloud on every pull request,
# so nobody has to run it on a laptop. Uses fakes only: no secrets, the live Firestore is never touched.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scripts/v5-test.js reads an older main commit with git show

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright
          npx -y playwright install --with-deps chromium

      - name: Run the harness
        run: NODE_PATH=$(npm root -g) node scripts/harness.js
